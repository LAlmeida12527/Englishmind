name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform scaffold
        run: flutter create --platforms=windows --project-name englishmind .
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --release
      - name: Upload Windows executable bundle
        uses: actions/upload-artifact@v4
        with:
          name: EnglishMind-Windows
          path: build/windows/x64/runner/Release/**
          retention-days: 14
